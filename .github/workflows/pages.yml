# Verify the public record, then publish docs/ to GitHub Pages.
#
# TWO JOBS ON PURPOSE. Verification is a property of a commit; publication is a
# separate privileged action. An environment approval or Pages outage must not
# prevent the integrity checks from running, and a deployment failure must not
# masquerade as a content-verification failure. `verify` therefore has read-only
# permissions and no environment. Only `deploy`, after `verify`, receives Pages
# and OIDC write authority.
#
# NO PATHS FILTER. The publication dependency closure includes source Markdown,
# claim records, receipts, generators, validators, licenses, assets, and tests.
# A hand-maintained filter can silently skip the gate when that closure changes.
#
# THIS FILE IS NOT SUFFICIENT. The separation above is only real while the Pages
# site is configured with `build_type=workflow`. Until 2026-08-12 it was set to
# `legacy` (branch `main`, path `/docs`), and GitHub's branch builder therefore
# published every push automatically, independently of Actions. `deploy` was not
# the publisher; it reported success without being the mechanism serving the
# site, and a commit whose `verify` job FAILED would have been published anyway.
#
# Setting Pages back to branch publishing would restore that failure silently
# and this file would still read as though it gated anything. If you change the
# Pages source, re-run the negative control: push a commit that fails `verify`,
# confirm `deploy` is skipped, and confirm the live site is byte-identical
# before and after. See `defect-publication-gate-vacuous.md` in the internal
# planning repository; commit 1a170c1 is the control, 0951faf its revert.
name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned build dependencies
        run: python3 -m pip install --requirement requirements.txt

      - name: Verify claims, assets, links, fixtures, and reproducibility
        run: python3 tools/verify_public.py

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

